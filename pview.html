<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>도서관리 - 상세보기</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="my.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Book Management
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="add.html">Add Book</a>
            </div>

        </div>

    </nav>


    <!-- Header -->
    <header class="page-header">
        <div class="container">
            <h1>도서 상세보기</h1>
            <p>도서의 상세 정보를 확인할 수 있습니다.</p>
        </div>
    </header>


    <!-- Main -->
    <main class="container my-5">

        <div class="card book-detail">

            <div class="card-header">
                <h2>도서 정보</h2>
            </div>


            <div class="card-body">

                <div class="detail-row">
                    <strong>도서 ID</strong>
                    <span>1</span>
                </div>

                <div class="detail-row">
                    <strong>제목</strong>
                    <span>해리 포터와 마법사의 돌</span>
                </div>

                <div class="detail-row">
                    <strong>저자</strong>
                    <span>J.K. Rowling</span>
                </div>

                <div class="detail-row">
                    <strong>출판사</strong>
                    <span>문학수첩</span>
                </div>

                <div class="detail-row">
                    <strong>장르</strong>
                    <span>판타지</span>
                </div>

                <div class="detail-row">
                    <strong>대여상태</strong>
                    <span class="badge bg-success">
                        대여 가능
                    </span>
                </div>


                <!-- Buttons -->
                <div class="button-area mt-4">

                    <a
                        href="edit.html"
                        class="btn btn-warning"
                    >
                        Edit
                    </a>

                    <button
                        type="button"
                        class="btn btn-danger"
                        disabled
                    >
                        Delete
                    </button>

                    <a
                        href="index.html"
                        class="btn btn-secondary"
                    >
                        List
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <div class="container">
            <p>Book Management System © 2026</p>
        </div>
    </footer>

</body>
</html>
